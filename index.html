<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSH Rapport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        button {
            width: 100%;
            padding: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .settings-btn {
            background: #6c757d;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.6;
            display: none;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            display: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin: 15px 0;
        }
        .emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🚒</div>
        <h1>OSH Rapport</h1>
        <p class="subtitle">Objekt, Skada, Hot</p>

        <button id="captureBtn">📸 Ta foto & analysera</button>
        <button class="settings-btn" id="settingsBtn">⚙️ Inställningar</button>

        <div class="loading" id="loading">⏳ Analyserar bild...</div>
        <div id="result"></div>

        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Inställningar</h2>
            <label>API-nyckel:</label>
            <input type="password" id="apiKeyInput" placeholder="sk-ant-api...">
            <button id="saveBtn">Spara</button>
            <button class="settings-btn" id="cancelBtn">Avbryt</button>
        </div>
    </div>

    <script>
        const captureBtn = document.getElementById('captureBtn');
        const fileInput = document.getElementById('fileInput');
        const result = document.getElementById('result');
        const loading = document.getElementById('loading');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // Ladda API-nyckel
        let apiKey = localStorage.getItem('anthropic_api_key') || '';

        settingsBtn.onclick = () => {
            apiKeyInput.value = apiKey;
            settingsModal.style.display = 'block';
        };

        saveBtn.onclick = () => {
            apiKey = apiKeyInput.value.trim();
            localStorage.setItem('anthropic_api_key', apiKey);
            settingsModal.style.display = 'none';
            alert('API-nyckel sparad!');
        };

        cancelBtn.onclick = () => {
            settingsModal.style.display = 'none';
        };

        captureBtn.onclick = () => {
            if (!apiKey) {
                alert('Lägg in din API-nyckel först! Tryck på Inställningar.');
                return;
            }
            fileInput.click();
        };

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Visa loading
            loading.style.display = 'block';
            result.style.display = 'none';
            captureBtn.disabled = true;

            try {
                // Konvertera till base64
                const base64 = await fileToBase64(file);

                // Anropa Claude API
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: 'image/jpeg',
                                        data: base64
                                    }
                                },
                                {
                                    type: 'text',
                                    text: 'Ge en OSH-rapport (framkomstrapport) för räddningscentralen.\n\nOBJEKT: Vad är inblandat - fordon, byggnad, antal personer etc\n\nSKADA: Vad som brinner/är skadat/händer just nu\n\nHOT: ENDAST de mest kritiska hoten som styr insatsen och resursbehovet:\n- Människoliv i fara\n- Stor spridningsrisk (brand/kemikalie)\n- Miljökatastrof (oljeutsläpp etc)\n\nIngen detaljinformation för manskap på plats. Håll det kort och konkret för räddningscentralen.'
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.content && data.content[0]) {
                    result.textContent = data.content[0].text;
                    result.style.display = 'block';
                } else {
                    result.textContent = 'Fel: ' + JSON.stringify(data);
                    result.style.display = 'block';
                }
            } catch (error) {
                result.textContent = 'Fel: ' + error.message;
                result.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                captureBtn.disabled = false;
            }
        };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
