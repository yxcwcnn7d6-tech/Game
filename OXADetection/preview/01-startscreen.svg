<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)" rx="40"/>

  <!-- Status bar -->
  <text x="35" y="22" fill="white" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600">9:41</text>
  <g transform="translate(310, 12)">
    <rect x="0" y="2" width="22" height="11" rx="2" stroke="white" stroke-width="1.2" fill="none"/>
    <rect x="23" y="5" width="2" height="5" rx="1" fill="white" opacity="0.4"/>
    <rect x="2" y="4" width="16" height="7" rx="1" fill="white"/>
  </g>

  <!-- Settings gear icon -->
  <circle cx="355" cy="60" r="16" fill="rgba(255,255,255,0.1)"/>
  <text x="355" y="65" fill="rgba(255,255,255,0.7)" font-size="16" text-anchor="middle" font-family="-apple-system, SF Pro">⚙</text>

  <!-- App icon -->
  <g transform="translate(195, 260)" filter="url(#glow)">
    <!-- Viewfinder icon -->
    <g stroke="#FF8C00" stroke-width="3" fill="none" stroke-linecap="round">
      <!-- Top left corner -->
      <path d="M-30,-30 L-30,-15 M-30,-30 L-15,-30"/>
      <!-- Top right corner -->
      <path d="M30,-30 L30,-15 M30,-30 L15,-30"/>
      <!-- Bottom left corner -->
      <path d="M-30,30 L-30,15 M-30,30 L-15,30"/>
      <!-- Bottom right corner -->
      <path d="M30,30 L30,15 M30,30 L15,30"/>
    </g>
    <!-- Warning triangle -->
    <g transform="translate(16, -12) scale(0.7)">
      <polygon points="0,-18 16,12 -16,12" fill="none" stroke="#FF8C00" stroke-width="2.5"/>
      <text x="0" y="8" fill="#FF8C00" font-size="16" text-anchor="middle" font-weight="bold">!</text>
    </g>
  </g>

  <!-- App title -->
  <text x="195" y="340" fill="white" font-family="-apple-system, SF Pro Display, Helvetica" font-size="36" font-weight="700" text-anchor="middle" letter-spacing="0.5">OXA Detektion</text>

  <!-- Subtitle -->
  <text x="195" y="370" fill="#8888aa" font-family="-apple-system, SF Pro, Helvetica" font-size="14" text-anchor="middle">Identifiering av oidentifierad</text>
  <text x="195" y="390" fill="#8888aa" font-family="-apple-system, SF Pro, Helvetica" font-size="14" text-anchor="middle">explosiv ammunition</text>

  <!-- Quick Start button -->
  <rect x="28" y="480" width="334" height="56" rx="14" fill="url(#orangeBtn)"/>
  <text x="70" y="503" fill="white" font-size="14" font-family="-apple-system, SF Pro">⚡</text>
  <text x="90" y="513" fill="white" font-family="-apple-system, SF Pro, Helvetica" font-size="17" font-weight="600">Snabbstart</text>
  <text x="280" y="513" fill="rgba(255,255,255,0.7)" font-family="-apple-system, SF Pro" font-size="12">Komplett scan</text>
  <text x="342" y="513" fill="rgba(255,255,255,0.7)" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- New Scan button -->
  <rect x="28" y="548" width="334" height="56" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="70" y="571" fill="white" font-size="14" font-family="-apple-system, SF Pro">📷</text>
  <text x="90" y="581" fill="white" font-family="-apple-system, SF Pro, Helvetica" font-size="17" font-weight="600">Ny skanning</text>
  <text x="342" y="581" fill="rgba(255,255,255,0.7)" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- History button -->
  <rect x="28" y="616" width="334" height="56" rx="14" fill="rgba(255,255,255,0.1)"/>
  <text x="70" y="639" fill="rgba(255,255,255,0.8)" font-size="14" font-family="-apple-system, SF Pro">🕐</text>
  <text x="90" y="649" fill="rgba(255,255,255,0.8)" font-family="-apple-system, SF Pro, Helvetica" font-size="17" font-weight="600">Historik</text>
  <text x="342" y="649" fill="rgba(255,255,255,0.5)" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- Version -->
  <text x="195" y="810" fill="rgba(128,128,128,0.5)" font-family="-apple-system, SF Pro" font-size="11" text-anchor="middle">v1.0 MVP</text>

  <!-- Home indicator -->
  <rect x="140" y="826" width="110" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
</svg>
