<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1200" viewBox="0 0 390 1200">
  <!-- Phone frame (scrollable content, taller than screen) -->
  <rect width="390" height="1200" fill="#f2f2f7" rx="20"/>

  <!-- Nav bar (sticky) -->
  <rect x="0" y="0" width="390" height="96" fill="rgba(242,242,247,0.97)" rx="20"/>
  <text x="195" y="72" fill="black" font-family="-apple-system, SF Pro" font-size="17" font-weight="600" text-anchor="middle">Inställningar</text>
  <text x="340" y="72" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="16" font-weight="600">Klar</text>
  <line x1="0" y1="96" x2="390" y2="96" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

  <!-- ==================== -->
  <!-- Section: Skanningsläge -->
  <!-- ==================== -->
  <text x="32" y="124" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">SKANNINGSLÄGE</text>
  <rect x="16" y="132" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="159" fill="black" font-family="-apple-system, SF Pro" font-size="16">Skanningsläge</text>
  <text x="310" y="159" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">Komplett</text>
  <text x="356" y="159" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>
  <text x="32" y="193" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="12">Full täckning - Alla kvadranter systematiskt</text>

  <!-- ==================== -->
  <!-- Section: AI-analys -->
  <!-- ==================== -->
  <text x="32" y="224" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">AI-ANALYS</text>
  <rect x="16" y="232" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="259" fill="black" font-family="-apple-system, SF Pro" font-size="16">AI-känslighet</text>
  <text x="318" y="259" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">Medel</text>
  <text x="356" y="259" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- ==================== -->
  <!-- Section: AI-konfiguration (NEW) -->
  <!-- ==================== -->
  <text x="32" y="306" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">AI-KONFIGURATION</text>
  <rect x="16" y="314" width="358" height="176" rx="10" fill="white"/>

  <!-- AI-källa picker -->
  <text x="32" y="341" fill="black" font-family="-apple-system, SF Pro" font-size="16">AI-källa</text>
  <text x="292" y="341" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="16">Extern API</text>
  <text x="356" y="341" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>
  <line x1="32" y1="355" x2="358" y2="355" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- API endpoint -->
  <text x="32" y="378" fill="black" font-family="-apple-system, SF Pro" font-size="16">API-endpoint URL</text>
  <text x="32" y="396" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="13">https://ai.example.com/v1/detect</text>
  <line x1="32" y1="408" x2="358" y2="408" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- API key -->
  <text x="32" y="431" fill="black" font-family="-apple-system, SF Pro" font-size="16">API-nyckel</text>
  <text x="260" y="431" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">••••••••••</text>
  <line x1="32" y1="445" x2="358" y2="445" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- Model name -->
  <text x="32" y="468" fill="black" font-family="-apple-system, SF Pro" font-size="16">Modellnamn (valfritt)</text>
  <text x="32" y="484" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="13">yolov8-oxa-v2</text>

  <!-- Footer text -->
  <text x="32" y="510" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="11">API:t ska ta emot en bild (multipart/form-data) och</text>
  <text x="32" y="523" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="11">returnera JSON med "detections"-array.</text>

  <!-- ==================== -->
  <!-- Section: Auto-capture -->
  <!-- ==================== -->
  <text x="32" y="556" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">AUTO-CAPTURE</text>
  <rect x="16" y="564" width="358" height="56" rx="10" fill="white"/>
  <text x="32" y="596" fill="black" font-family="-apple-system, SF Pro" font-size="16">Automatisk bildtagning</text>
  <rect x="310" y="582" width="51" height="31" rx="15.5" fill="#34C759"/>
  <circle cx="345" cy="597.5" r="13.5" fill="white"/>

  <!-- ==================== -->
  <!-- Section: Rapport -->
  <!-- ==================== -->
  <text x="32" y="648" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">RAPPORT</text>
  <rect x="16" y="656" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="683" fill="black" font-family="-apple-system, SF Pro" font-size="16">Rapport-format</text>
  <text x="278" y="683" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">OSH-standard</text>
  <text x="356" y="683" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- ==================== -->
  <!-- Section: Rapportleverans (NEW) -->
  <!-- ==================== -->
  <text x="32" y="730" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">RAPPORTLEVERANS</text>
  <rect x="16" y="738" width="358" height="220" rx="10" fill="white"/>

  <!-- Email -->
  <text x="32" y="763" fill="black" font-family="-apple-system, SF Pro" font-size="16">Mottagarens e-post</text>
  <text x="32" y="781" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="13">insatsledare@raddning.se</text>
  <line x1="32" y1="793" x2="358" y2="793" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- Report API endpoint -->
  <text x="32" y="816" fill="black" font-family="-apple-system, SF Pro" font-size="16">Rapport-API endpoint</text>
  <text x="32" y="834" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="13">https://sos-alarm.se/api/reports</text>
  <line x1="32" y1="846" x2="358" y2="846" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- Report API key -->
  <text x="32" y="869" fill="black" font-family="-apple-system, SF Pro" font-size="16">Rapport-API nyckel</text>
  <text x="260" y="869" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">••••••••••</text>
  <line x1="32" y1="883" x2="358" y2="883" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- Auto-send toggle -->
  <text x="32" y="916" fill="black" font-family="-apple-system, SF Pro" font-size="16">Skicka rapport automatiskt</text>
  <rect x="310" y="900" width="51" height="31" rx="15.5" fill="#34C759"/>
  <circle cx="345" cy="915.5" r="13.5" fill="white"/>

  <!-- Footer -->
  <text x="32" y="976" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="11">Rapporten skickas automatiskt via e-post och/eller</text>
  <text x="32" y="989" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="11">API när skanningen är klar.</text>

  <!-- ==================== -->
  <!-- Section: Om -->
  <!-- ==================== -->
  <text x="32" y="1022" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">OM</text>
  <rect x="16" y="1030" width="358" height="132" rx="10" fill="white"/>

  <text x="32" y="1057" fill="black" font-family="-apple-system, SF Pro" font-size="16">Version</text>
  <text x="320" y="1057" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">1.0 MVP</text>
  <line x1="32" y1="1071" x2="358" y2="1071" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <text x="32" y="1094" fill="black" font-family="-apple-system, SF Pro" font-size="16">AI-källa</text>
  <text x="186" y="1094" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="13">https://ai.example.com/v1/detect</text>
  <line x1="32" y1="1108" x2="358" y2="1108" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <text x="32" y="1131" fill="black" font-family="-apple-system, SF Pro" font-size="16">Rapport till</text>
  <text x="220" y="1131" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">insatsledare@raddning.se</text>
</svg>
