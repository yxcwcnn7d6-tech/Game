<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Phone frame -->
  <rect width="390" height="844" fill="#f2f2f7" rx="40"/>

  <!-- Nav bar -->
  <rect x="0" y="0" width="390" height="96" fill="rgba(242,242,247,0.94)" rx="40"/>
  <text x="195" y="72" fill="black" font-family="-apple-system, SF Pro" font-size="17" font-weight="600" text-anchor="middle">Inställningar</text>
  <text x="340" y="72" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="16" font-weight="600">Klar</text>
  <line x1="0" y1="96" x2="390" y2="96" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

  <!-- Section: Skanningsläge -->
  <text x="32" y="126" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13" text-transform="uppercase">SKANNINGSLÄGE</text>
  <rect x="16" y="136" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="163" fill="black" font-family="-apple-system, SF Pro" font-size="16">Skanningsläge</text>
  <text x="310" y="163" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">Komplett</text>
  <text x="356" y="163" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>
  <text x="32" y="198" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="12">Full täckning - Alla kvadranter systematiskt</text>

  <!-- Section: Zoom -->
  <text x="32" y="232" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">ZOOM</text>
  <rect x="16" y="242" width="358" height="88" rx="10" fill="white"/>
  <text x="32" y="270" fill="black" font-family="-apple-system, SF Pro" font-size="16">Max zoom-nivå</text>
  <text x="296" y="270" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">Max (5x)</text>
  <text x="356" y="270" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>
  <line x1="32" y1="286" x2="358" y2="286" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="32" y="316" fill="black" font-family="-apple-system, SF Pro" font-size="16">Antal nivåer: 3</text>
  <!-- Stepper -->
  <rect x="302" y="300" width="60" height="28" rx="7" fill="#f2f2f7" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  <text x="320" y="319" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="18" text-anchor="middle">−</text>
  <line x1="332" y1="302" x2="332" y2="326" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  <text x="346" y="319" fill="#007AFF" font-family="-apple-system, SF Pro" font-size="18" text-anchor="middle">+</text>

  <!-- Section: AI-analys -->
  <text x="32" y="360" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">AI-ANALYS</text>
  <rect x="16" y="370" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="397" fill="black" font-family="-apple-system, SF Pro" font-size="16">AI-känslighet</text>
  <text x="318" y="397" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">Medel</text>
  <text x="356" y="397" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>
  <text x="32" y="432" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="12">Hög känslighet ger fler detektioner men kan ge falska positiva</text>

  <!-- Section: Auto-capture -->
  <text x="32" y="466" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">AUTO-CAPTURE</text>
  <rect x="16" y="476" width="358" height="100" rx="10" fill="white"/>
  <text x="32" y="504" fill="black" font-family="-apple-system, SF Pro" font-size="16">Automatisk bildtagning</text>
  <!-- Toggle ON -->
  <rect x="310" y="490" width="51" height="31" rx="15.5" fill="#34C759"/>
  <circle cx="345" cy="505.5" r="13.5" fill="white"/>
  <line x1="32" y1="520" x2="358" y2="520" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="32" y="546" fill="black" font-family="-apple-system, SF Pro" font-size="16">Stabiliseringstid</text>
  <text x="338" y="546" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">0.5s</text>
  <!-- Slider track -->
  <rect x="32" y="558" width="326" height="4" rx="2" fill="#e5e5ea"/>
  <rect x="32" y="558" width="55" height="4" rx="2" fill="#007AFF"/>
  <circle cx="87" cy="560" r="12" fill="white" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

  <!-- Section: Rapport -->
  <text x="32" y="602" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">RAPPORT</text>
  <rect x="16" y="612" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="639" fill="black" font-family="-apple-system, SF Pro" font-size="16">Rapport-format</text>
  <text x="278" y="639" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">OSH-standard</text>
  <text x="356" y="639" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- Section: Datahantering -->
  <text x="32" y="686" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">DATAHANTERING</text>
  <rect x="16" y="696" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="723" fill="black" font-family="-apple-system, SF Pro" font-size="16">Datahantering</text>
  <text x="288" y="723" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="16">Spara lokalt</text>
  <text x="356" y="723" fill="#c7c7cc" font-family="-apple-system, SF Pro" font-size="14">›</text>

  <!-- Section: Om -->
  <text x="32" y="770" fill="#6d6d72" font-family="-apple-system, SF Pro" font-size="13">OM</text>
  <rect x="16" y="780" width="358" height="44" rx="10" fill="white"/>
  <text x="32" y="800" fill="black" font-family="-apple-system, SF Pro" font-size="15">Version</text>
  <text x="320" y="800" fill="#8e8e93" font-family="-apple-system, SF Pro" font-size="15">1.0 MVP</text>

  <!-- Home indicator -->
  <rect x="140" y="826" width="110" height="5" rx="2.5" fill="rgba(0,0,0,0.2)"/>
</svg>
